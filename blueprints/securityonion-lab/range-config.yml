# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
# Security Onion 2.4 lab — VLAN 10 targets (sniffed), 20 SO/SOC, 99 attacker.
# Role attaches SO net1 after IP config. Prefer hub-mode on the range bridge during deploy.

network:
  inter_vlan_default: DROP
  rules:
    - name: Allow Kali to targets
      vlan_src: 99
      vlan_dst: 10
      protocol: all
      ports: all
      action: ACCEPT
    # Blue team (VLAN 10 targets) → SOC UI; red team Kali (99) deliberately blocked
    - name: Allow Target VLAN to SO SOC HTTPS
      vlan_src: 10
      vlan_dst: 20
      protocol: tcp
      ports: 443
      action: ACCEPT
    - name: Allow WireGuard to SO SOC HTTPS
      vlan_src: wireguard
      vlan_dst: 20
      protocol: tcp
      ports: 443
      action: ACCEPT
    - name: Allow WireGuard to SO SSH
      vlan_src: wireguard
      vlan_dst: 20
      protocol: tcp
      ports: 22
      action: ACCEPT
    - name: Allow WireGuard to Adaptix C2
      vlan_src: wireguard
      vlan_dst: 99
      protocol: tcp
      ports: "4321"
      action: ACCEPT
    - name: Allow targets to SO Fleet
      vlan_src: 10
      vlan_dst: 20
      protocol: tcp
      # Ludus schema: integer, "all", "start:end", or comma list — not a YAML array
      ports: "8220,5055,8443"
      action: ACCEPT

ludus:
  - vm_name: "{{ range_id }}-so"
    hostname: "{{ range_id }}-so"
    template: securityonion-2.4-x64-template
    vlan: 20
    ip_last_octet: 20
    # so-setup checks MemTotal ≥ 16 GiB. A 16 GiB VM reports ~15.2 GiB, so min and max are both 20.
    ram_min_gb: 20
    ram_gb: 20
    cpus: 8
    linux: true
    # Guest agent reports Oracle Linux id "ol". Ludus ships no vars for that group.
    # rhel group_vars are localuser:password, created by the SO template.
    ansible_groups:
      - rhel
    testing:
      snapshot: false
      block_internet: true
    roles:
      - name: ryokubaka.ludus_securityonion
      - name: ryokubaka.ludus_so_elastic_security
    role_vars:
      ludus_so_install_type: standalone
      ludus_so_allow_cidr: "10.{{ range_second_octet }}.0.0/16"
      ludus_so_web_user: "onionadmin@ludus.local"
      ludus_so_web_password: "MeowMeow123"

  - vm_name: "{{ range_id }}-dc01"
    hostname: "{{ range_id }}-DC01"
    template: win2019-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: meow.local
      role: primary-dc
    testing:
      snapshot: true
      block_internet: true
    roles:
      # depends_on must be under the role (not the VM) — Ludus cross-VM ordering
      - name: ryokubaka.ludus_so_elastic_agent
        depends_on:
          - vm_name: "{{ range_id }}-so"
            role: ryokubaka.ludus_securityonion

  - vm_name: "{{ range_id }}-win11"
    hostname: "{{ range_id }}-WIN11"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: meow.local
      role: member
    testing:
      snapshot: true
      block_internet: true
    roles:
      - name: ryokubaka.ludus_so_elastic_agent
        depends_on:
          - vm_name: "{{ range_id }}-so"
            role: ryokubaka.ludus_securityonion

  - vm_name: "{{ range_id }}-kali"
    hostname: "{{ range_id }}-kali"
    template: kali-x64-desktop-template
    vlan: 99
    ip_last_octet: 1
    ram_gb: 4
    cpus: 2
    linux: true
    testing:
      snapshot: false
      block_internet: true
    roles:
      - name: badsectorlabs.ludus_adaptix_c2
    role_vars:
      ludus_adaptix_c2_install_server: true
      ludus_adaptix_c2_install_client: true
