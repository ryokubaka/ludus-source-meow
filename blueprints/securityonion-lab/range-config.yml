# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
# =============================================================================
# Security Onion 2.4 Standalone Lab
# =============================================================================
# VLAN 10 — targets (sniffed)
# VLAN 20 — Security Onion management / SOC
# VLAN 99 — attacker
#
# LUX may also attach SO net1 during deploy (idempotent). Role attaches net1 via Proxmox API if missing.
# RAM: SO balloon 8–24 GB (ram_min_gb/ram_gb) + target 2 + kali 4
# =============================================================================

network:
  inter_vlan_default: DROP
  rules:
    - name: Allow Kali to targets
      vlan_src: 99
      vlan_dst: 10
      protocol: all
      ports: all
      action: ACCEPT
    - name: Allow Kali to SO SOC HTTPS
      vlan_src: 99
      vlan_dst: 20
      protocol: tcp
      ports: 443
      action: ACCEPT
    - name: Allow WireGuard to SO SOC HTTPS
      vlan_src: wireguard
      vlan_dst: 20
      protocol: tcp
      ports: 443
      action: ACCEPT
    - name: Allow WireGuard to SO SSH
      vlan_src: wireguard
      vlan_dst: 20
      protocol: tcp
      ports: 22
      action: ACCEPT
    - name: Allow targets to SO Fleet
      vlan_src: 10
      vlan_dst: 20
      protocol: tcp
      ports:
        - 8220
        - 5055
        - 8443
      action: ACCEPT
    - name: Allow Kali to SO Fleet
      vlan_src: 99
      vlan_dst: 20
      protocol: tcp
      ports:
        - 8220
        - 5055
        - 8443
      action: ACCEPT

ludus:
  - vm_name: "{{ range_id }}-so"
    hostname: "{{ range_id }}-so"
    template: securityonion-2.4-x64-template
    vlan: 20
    ip_last_octet: 20
    # balloon: Proxmox min=8 / max=24 — host can reclaim down to 8 GB under pressure
    ram_min_gb: 8
    ram_gb: 24
    cpus: 8
    linux: true
    testing:
      snapshot: false
      block_internet: false
    roles:
      - name: ryokubaka.ludus_securityonion
      - name: ryokubaka.ludus_so_elastic_security
    role_vars:
      ludus_so_install_type: standalone
      ludus_so_allow_cidr: "10.{{ range_second_octet }}.0.0/16"
      ludus_so_web_user: "onionadmin@ludus.local"
      ludus_so_web_password: "0n10nAdm1n!"

  - vm_name: "{{ range_id }}-target"
    hostname: "{{ range_id }}-target"
    template: debian-12-x64-server-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 2
    cpus: 2
    linux: true
    testing:
      snapshot: true
      block_internet: true
    roles:
      - name: ryokubaka.ludus_so_elastic_agent
    depends_on:
      - vm_name: "{{ range_id }}-so"
        role: ryokubaka.ludus_securityonion

  - vm_name: "{{ range_id }}-kali"
    hostname: "{{ range_id }}-kali"
    template: kali-x64-desktop-template
    vlan: 99
    ip_last_octet: 1
    ram_gb: 4
    cpus: 2
    linux: true
    testing:
      snapshot: false
      block_internet: false
    roles:
      - name: ryokubaka.ludus_so_elastic_agent
    depends_on:
      - vm_name: "{{ range_id }}-so"
        role: ryokubaka.ludus_securityonion
