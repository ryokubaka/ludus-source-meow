---
# Remove an existing Elastic Agent so the next enroll targets the current SO Fleet.
# WinRM: no become/sudo. Run uninstall from outside the install dir.

- name: Check for installed Elastic Agent binary (Windows)
  ansible.windows.win_stat:
    path: "{{ ludus_so_agent_install_path_windows }}\\elastic-agent.exe"
  register: ludus_so_agent_bin_win

- name: Uninstall Elastic Agent (Windows)
  ansible.windows.win_shell: |
    $agent = Join-Path '{{ ludus_so_agent_install_path_windows }}' 'elastic-agent.exe'
    $args = @('uninstall', '--force')
    {% if ludus_so_agent_uninstall_token_resolved | default('') | length > 0 %}
    $args += @('--uninstall-token', '{{ ludus_so_agent_uninstall_token_resolved }}')
    {% endif %}
    & $agent @args
    exit $LASTEXITCODE
  args:
    chdir: C:\Windows\Temp
  no_log: true
  when: ludus_so_agent_bin_win.stat.exists | default(false)
  register: ludus_so_agent_win_uninstall
  failed_when: false
  changed_when: ludus_so_agent_win_uninstall.rc | default(1) == 0

- name: Wait until Windows Elastic Agent binary is removed
  ansible.windows.win_stat:
    path: "{{ ludus_so_agent_install_path_windows }}\\elastic-agent.exe"
  register: ludus_so_agent_bin_win_after
  until: not (ludus_so_agent_bin_win_after.stat.exists | default(false))
  retries: 15
  delay: 2
  failed_when: false
  when: ludus_so_agent_bin_win.stat.exists | default(false)

- name: Fail when Windows Elastic Agent uninstall left the binary in place
  ansible.builtin.fail:
    msg: >-
      elastic-agent uninstall did not remove
      {{ ludus_so_agent_install_path_windows }}\elastic-agent.exe on {{ inventory_hostname }}
      (rc={{ ludus_so_agent_win_uninstall.rc | default('n/a') }}).
      If Elastic Defend tamper protection is on, the Fleet uninstall token for
      {{ ludus_so_agent_policy_id }} has to be valid. Set ludus_so_agent_uninstall_token
      when Fleet does not issue one.
  when:
    - ludus_so_agent_bin_win.stat.exists | default(false)
    - (ludus_so_agent_bin_win_after.stat | default({})).exists | default(false)

- name: Remove Windows install marker after uninstall
  ansible.windows.win_shell: |
    $p = '{{ ludus_so_agent_marker_windows }}'
    if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Force }
  when: >
    (ludus_so_agent_bin_win.stat.exists | default(false))
    or (ludus_so_agent_marker_stat_win.stat.exists | default(false))

- name: Mark Windows agent binary absent after uninstall
  ansible.builtin.set_fact:
    ludus_so_agent_bin_present: false
