---
# Remove an existing Elastic Agent so the next enroll targets the current SO Fleet.
# Run uninstall from outside the install dir (Elastic requirement).

- name: Check for installed Elastic Agent binary (Linux)
  ansible.builtin.stat:
    path: "{{ ludus_so_agent_install_path_linux }}/elastic-agent"
  register: ludus_so_agent_bin_linux

- name: Uninstall Elastic Agent (Linux)
  ansible.builtin.command:
    argv: "{{ [ludus_so_agent_install_path_linux ~ '/elastic-agent', 'uninstall', '--force'] + (['--uninstall-token', ludus_so_agent_uninstall_token_resolved] if (ludus_so_agent_uninstall_token_resolved | default('') | length > 0) else []) }}"
    chdir: /tmp
  become: true
  no_log: true
  when: ludus_so_agent_bin_linux.stat.exists | default(false)
  register: ludus_so_agent_linux_uninstall
  failed_when: false
  changed_when: ludus_so_agent_linux_uninstall.rc | default(1) == 0

- name: Wait until Linux Elastic Agent binary is removed
  ansible.builtin.stat:
    path: "{{ ludus_so_agent_install_path_linux }}/elastic-agent"
  register: ludus_so_agent_bin_linux_after
  until: not (ludus_so_agent_bin_linux_after.stat.exists | default(false))
  retries: 15
  delay: 2
  failed_when: false
  when: ludus_so_agent_bin_linux.stat.exists | default(false)

- name: Fail when Linux Elastic Agent uninstall left the binary in place
  ansible.builtin.fail:
    msg: >-
      elastic-agent uninstall did not remove
      {{ ludus_so_agent_install_path_linux }}/elastic-agent on {{ inventory_hostname }}
      (rc={{ ludus_so_agent_linux_uninstall.rc | default('n/a') }}).
      If Elastic Defend tamper protection is on, the Fleet uninstall token for
      {{ ludus_so_agent_policy_id }} has to be valid. Set ludus_so_agent_uninstall_token
      when Fleet does not issue one.
  when:
    - ludus_so_agent_bin_linux.stat.exists | default(false)
    - (ludus_so_agent_bin_linux_after.stat | default({})).exists | default(false)

- name: Remove Linux install marker after uninstall
  ansible.builtin.file:
    path: "{{ ludus_so_agent_marker_linux }}"
    state: absent
  become: true
  when: >
    (ludus_so_agent_bin_linux.stat.exists | default(false))
    or (ludus_so_agent_marker_stat.stat.exists | default(false))

- name: Mark Linux agent binary absent after uninstall
  ansible.builtin.set_fact:
    ludus_so_agent_bin_present: false
