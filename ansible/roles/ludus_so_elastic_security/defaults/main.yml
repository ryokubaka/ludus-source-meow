---
# Start Elastic trial (platinum-class features for 30 days) — mirrors GOAD-mod es_xpack_trial
ludus_so_elastic_security_start_trial: true

# Elastic Defend on endpoints-initial: leave DataCollection and turn protections on.
# SO 3.3 / Elastic 9.4.5 names this integration elastic-defend-endpoints (Defend 9.4.1).
# Osquery, System, and the custom windows-defender winlog policy are not rewritten.
ludus_so_elastic_security_configure_defend: true
ludus_so_elastic_security_defend_policy_name: elastic-defend-endpoints
ludus_so_elastic_security_agent_policy_id: endpoints-initial
# Fleet preset: DataCollection | NGAV | EDREssential | EDRComplete
ludus_so_elastic_security_defend_preset: EDRComplete
# Protection mode for malware / ransomware / memory / behavior: detect | prevent | off
ludus_so_elastic_security_defend_mode: detect
# Show endpoint-user popups for all protection types (SIEM alerts always fire in detect/prevent)
ludus_so_elastic_security_defend_user_notify: true

# windows-endpoints already collects Sysmon. Also enable AppLocker (EXE/DLL and
# MSI/Script), Packaged app-Deployment, Packaged app-Execution, and Windows Defender.
ludus_so_elastic_security_configure_windows_logs: true
ludus_so_elastic_security_windows_policy_name: windows-endpoints

# Install Elastic prebuilt rules via the Fleet package the Rules UI uses,
# then enable disabled rules. Empty version means the latest package Fleet knows.
ludus_so_elastic_security_enable_rules: true
ludus_so_elastic_security_detection_engine_package: security_detection_engine
ludus_so_elastic_security_detection_engine_version: ""

# Seconds to wait after the package POST for rules to show up in _find.
ludus_so_elastic_security_prepackaged_pause: 120

# Kibana 9 public detection-engine routes require this (bulk enable is versioned).
ludus_so_elastic_security_api_version: "2023-10-31"

# _find / bulk chunk size. Kibana accepts 1000 ids per bulk action.
# GOAD elk uses 100; 1000 is two calls for the ~2000 prebuilt rules.
ludus_so_elastic_security_bulk_page_size: 1000

# File-realm map for the Kibana "Enable/Disable rules" sub-feature (Elastic 9.4).
ludus_so_elastic_security_users_roles: /opt/so/saltstack/local/salt/elasticsearch/files/users_roles
ludus_so_elastic_security_rules_role: ludus_so_detection_rules

# Max enable loops (safety; 100 rules/loop × 50 = 5000 rules)
ludus_so_elastic_security_enable_max_loops: 50

# Marker after successful run
ludus_so_elastic_security_marker: /etc/ludus-so-elastic-security-complete

# Re-run even when marker present
ludus_so_elastic_security_force: false

# Require SO setup marker first
ludus_so_elastic_security_require_so_setup: true
ludus_so_setup_marker: /etc/ludus-so-setup-complete

# SOC login created by so-setup (WEBUSER). Gets the SOC superuser role plus an
# Elasticsearch role with every Kibana feature .all privilege, including
# Alerts and Rules, index all on restricted indices, and the default space
# left with no features disabled.
ludus_so_elastic_security_grant_admin: true
ludus_so_elastic_security_admin_user: "{{ ludus_so_web_user | default('onionadmin@ludus.local', true) }}"
ludus_so_elastic_security_admin_role: ludus-all
ludus_so_elastic_security_admin_role_file: /opt/so/saltstack/local/salt/elasticsearch/roles/ludus-all.json

# Wait for ES API after so-setup (containers up ≠ API ready). retries × delay.
ludus_so_elastic_security_es_wait_retries: 90
ludus_so_elastic_security_es_wait_delay: 20
