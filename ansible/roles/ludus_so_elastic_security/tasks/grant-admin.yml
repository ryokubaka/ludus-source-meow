# Elastic 9.4 keeps Detection & Response, the rule list, and cases behind the
# Alerts, Rules, and Cases features. Two things hide them from the SOC account:
# a Kibana role that also has the base "all" privilege (Kibana then ignores the
# feature privileges), and the default space, which ships with those features
# disabled. Grant every feature .all privilege without the base privilege, allow
# the restricted alerts index, and leave the default space with nothing disabled.

- name: Grant SOC superuser and every Kibana privilege
  ansible.builtin.shell: |
    set -euo pipefail
    CFG=/opt/so/conf/elasticsearch/curl.config
    USER="{{ ludus_so_elastic_security_admin_user }}"
    ROLE="{{ ludus_so_elastic_security_admin_role }}"
    ROLE_FILE="{{ ludus_so_elastic_security_admin_role_file }}"
    SALT_ROLES=/opt/so/saltstack/local/salt/elasticsearch/files/users_roles
    CONF_ROLES=/opt/so/conf/elasticsearch/users_roles
    BODY=/tmp/ludus-all-role.json

    priv_json=$(curl -sS -k -K "$CFG" 'https://localhost:9200/_security/privilege/kibana-.kibana')
    if ! jq -e '.["kibana-.kibana"] | type == "object"' >/dev/null <<<"$priv_json"; then
      echo "Kibana privilege lookup failed: $(printf '%s' "$priv_json" | head -c 400)" >&2
      exit 1
    fi
    # Feature privileges only. The base "all" privilege makes Kibana ignore
    # them, and a .read entry can hide the matching .all entry.
    privs=$(jq -c '
      .["kibana-.kibana"]
      | keys
      | map(select(endswith(".all") and (startswith("reserved") | not)))
    ' <<<"$priv_json")
    echo "security_solution_all=$(jq -r '[.[] | select(test("securitySolution"))] | join(",")' <<<"$privs")"
    if ! jq -e 'map(select(test("securitySolutionAlerts"))) | length > 0' >/dev/null <<<"$privs"; then
      echo "this stack did not advertise a Security Alerts .all privilege" >&2
      jq -r '.["kibana-.kibana"] | keys[] | select(test("securitySolution"))' <<<"$priv_json" >&2
      exit 1
    fi
    if ! jq -e 'map(select(test("securitySolutionRules"))) | length > 0' >/dev/null <<<"$privs"; then
      echo "this stack did not advertise a Security Rules .all privilege" >&2
      jq -r '.["kibana-.kibana"] | keys[] | select(test("securitySolution"))' <<<"$priv_json" >&2
      exit 1
    fi
    jq -n --argjson privs "$privs" '{
      cluster: ["all"],
      indices: [{
        names: ["*"],
        privileges: ["all"],
        allow_restricted_indices: true
      }],
      applications: [{
        application: "kibana-.kibana",
        privileges: $privs,
        resources: ["*"]
      }],
      run_as: []
    }' > "$BODY"
    npriv=$(jq '.applications[0].privileges | length' "$BODY")
    echo "kibana_privileges=${npriv}"
    if [[ "$npriv" -lt 1 ]]; then
      echo "no Kibana privileges returned" >&2
      exit 1
    fi

    mkdir -p "$(dirname "$ROLE_FILE")"
    cp "$BODY" "$ROLE_FILE"
    chmod 644 "$ROLE_FILE"

    role_body=$(curl -sS -k -K "$CFG" -w '\n%{http_code}' \
      -X PUT "https://localhost:9200/_security/role/${ROLE}" \
      -H 'Content-Type: application/json' \
      --data-binary @"$BODY")
    role_code=$(tail -n1 <<<"$role_body")
    if [[ "$role_code" != 200 && "$role_code" != 201 ]]; then
      echo "creating ${ROLE} failed (http ${role_code}): $(printf '%s' "$role_body" | head -c 400)" >&2
      exit 1
    fi
    echo "role=${ROLE} http=${role_code}"

    grant() {
      local role="$1"
      local out rc=0
      out=$(/usr/sbin/so-user addrole --email "$USER" --role "$role" 2>&1) || rc=$?
      printf '%s\n' "$out"
      if grep -q 'already has the role' <<<"$out"; then
        echo "soc_${role}=present"
        return 0
      fi
      if grep -q 'Successfully added role' <<<"$out"; then
        echo "soc_${role}=added"
        return 0
      fi
      echo "so-user addrole ${role} failed rc=${rc}" >&2
      return 1
    }
    grant superuser
    grant "$ROLE"

    # SO 3 keeps SOC roles in so-user/Kratos. The Elasticsearch file realm
    # users_roles list stays service accounts only, so waiting for so-user to
    # rewrite it never succeeds. Append the mapping ourselves when absent.
    ensure_users_roles_line() {
      local file="$1"
      local role="$2"
      local user="$3"
      mkdir -p "$(dirname "$file")"
      touch "$file"
      if grep -qiE "^${role}:${user}$|^${role}:${user},|^${role}:.*,${user}$|^${role}:.*,${user}," "$file"; then
        return 0
      fi
      if grep -qE "^${role}:" "$file"; then
        sed -i -E "s|^(${role}:.*)|\1,${user}|" "$file"
      else
        printf '%s\n' "${role}:${user}" >> "$file"
      fi
    }
    ensure_users_roles_line "$SALT_ROLES" "$ROLE" "$USER"
    ensure_users_roles_line "$SALT_ROLES" superuser "$USER"
    echo "roles_file=present"

    if [[ -f "$CONF_ROLES" ]]; then
      ensure_users_roles_line "$CONF_ROLES" "$ROLE" "$USER"
      ensure_users_roles_line "$CONF_ROLES" superuser "$USER"
      chown 930:939 "$CONF_ROLES" 2>/dev/null || true
      chmod 660 "$CONF_ROLES" 2>/dev/null || true
      echo "conf_roles=present"
    else
      cp "$SALT_ROLES" "$CONF_ROLES"
      chown 930:939 "$CONF_ROLES" 2>/dev/null || true
      chmod 660 "$CONF_ROLES" 2>/dev/null || true
      echo "conf_roles=copied"
    fi

    space_json=$(curl -sS -k -K "$CFG" \
      -H 'kbn-xsrf: true' \
      -H 'elastic-api-version: 2023-10-31' \
      http://127.0.0.1:5601/api/spaces/space/default)
    if ! jq -e '.id == "default"' >/dev/null <<<"$space_json"; then
      echo "Kibana space lookup failed: $(printf '%s' "$space_json" | head -c 400)" >&2
      exit 1
    fi
    disabled_n=$(jq '.disabledFeatures | length' <<<"$space_json")
    if [[ "$disabled_n" != "0" ]]; then
      space_put=$(curl -sS -k -K "$CFG" -w '\n%{http_code}' \
        -X PUT http://127.0.0.1:5601/api/spaces/space/default \
        -H 'kbn-xsrf: true' \
        -H 'elastic-api-version: 2023-10-31' \
        -H 'Content-Type: application/json' \
        --data-binary "$(jq 'del(._reserved) | .disabledFeatures = []' <<<"$space_json")")
      space_code=$(tail -n1 <<<"$space_put")
      if [[ "$space_code" != "200" ]]; then
        echo "opening the default Kibana space failed (http ${space_code}): $(printf '%s' "$space_put" | head -c 400)" >&2
        exit 1
      fi
      echo "space_features=opened"
    else
      echo "space_features=open"
    fi
  args:
    executable: /bin/bash
  register: ludus_so_elastic_security_admin_grant
  changed_when: >-
    '=added' in (ludus_so_elastic_security_admin_grant.stdout | default(''))
    or 'conf_roles=copied' in (ludus_so_elastic_security_admin_grant.stdout | default(''))
    or 'space_features=opened' in (ludus_so_elastic_security_admin_grant.stdout | default(''))
  become: true

- name: Report SOC privilege grant
  ansible.builtin.debug:
    msg: "{{ ludus_so_elastic_security_admin_grant.stdout_lines | default([]) | join(' | ') }}"
