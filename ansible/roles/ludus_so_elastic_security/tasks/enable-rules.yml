---
# Kibana 9.4 keeps the Elastic rules catalog in Fleet package
# security_detection_engine. Installing that package does not put the rules
# on the Rules page. The page's "Add Elastic rules" action is
# POST /internal/detection_engine/prebuilt_rules/installation/_perform
# with mode ALL_RULES. A manager that already has the Elastic Defend rule
# must not be treated as finished. Bulk enable still uses
# elastic-api-version 2023-10-31. Without that header every enable is a 400,
# curl still exits 0, and the same disabled page is counted forever.
- name: Install the Elastic prebuilt rules Fleet package
  ansible.builtin.shell: |
    set -euo pipefail
    CFG=/opt/so/conf/elasticsearch/curl.config
    POL='{{ ludus_so_elastic_security_agent_policy_id }}'
    PKG='{{ ludus_so_elastic_security_detection_engine_package }}'
    VER='{{ ludus_so_elastic_security_detection_engine_version }}'
    H=(-H 'kbn-xsrf: true' -H 'Content-Type: application/json')
    api() {
      curl -sS --max-time 120 -K "$CFG" "${H[@]}" "$@"
    }

    LIST=$(api "http://localhost:5601/api/fleet/package_policies?perPage=200")
    if ! jq -e '.items' >/dev/null <<<"$LIST"; then
      echo "package policy list failed: $(printf '%s' "$LIST" | head -c 400)" >&2
      exit 1
    fi
    existing=$(jq -r --arg pkg "$PKG" '
      [.items[]? | select(.package.name == $pkg)]
      | .[0]
      | if . == null then "" else "\(.id) \(.name) \(.package.version)" end
    ' <<<"$LIST")
    if [[ -n "$existing" ]]; then
      echo "already_installed ${existing}"
    else
      if [[ -z "$VER" ]]; then
        info=$(api "http://localhost:5601/api/fleet/epm/packages/${PKG}")
        VER=$(jq -r '.item.latestVersion // .item.version // .version // empty' <<<"$info")
      fi
      if [[ -z "$VER" || "$VER" == null ]]; then
        echo "could not resolve ${PKG} version: $(printf '%s' "${info:-}" | head -c 400)" >&2
        exit 1
      fi
      name="${PKG}-1"
      body=$(jq -nc --arg ver "$VER" --arg pol "$POL" --arg name "$name" --arg pkg "$PKG" '{
        policy_ids: [$pol],
        package: {name: $pkg, version: $ver},
        name: $name,
        description: "",
        namespace: "",
        inputs: {}
      }')
      raw=$(curl -sS --max-time 600 -K "$CFG" "${H[@]}" \
        -X POST 'http://localhost:5601/api/fleet/package_policies' \
        -d "$body" -w '\n%{http_code}')
      code=$(tail -n1 <<<"$raw")
      resp=$(sed '$d' <<<"$raw")
      if [[ "$code" != 200 && "$code" != 201 ]]; then
        echo "install ${PKG} ${VER} failed (http ${code}): $(printf '%s' "$resp" | head -c 500)" >&2
        exit 1
      fi
      echo "installed $(jq -r '"\(.item.id) \(.item.name) \(.item.package.version)"' <<<"$resp")"
    fi

    raw=$(curl -sS --max-time 900 -K "$CFG" "${H[@]}" \
      -H 'elastic-api-version: 1' \
      -H 'x-elastic-internal-origin: Kibana' \
      -X POST 'http://localhost:5601/internal/detection_engine/prebuilt_rules/installation/_perform' \
      -d '{"mode":"ALL_RULES"}' -w '\n%{http_code}')
    code=$(tail -n1 <<<"$raw")
    resp=$(sed '$d' <<<"$raw")
    if [[ "$code" != 200 ]]; then
      echo "installing prebuilt rules failed (http ${code}): $(printf '%s' "$resp" | head -c 500)" >&2
      exit 1
    fi
    if ! jq -e '.summary.succeeded | type == "number"' >/dev/null <<<"$resp"; then
      echo "install response missing summary: $(printf '%s' "$resp" | head -c 400)" >&2
      exit 1
    fi
    installed_n=$(jq -r '.summary.succeeded' <<<"$resp")
    failed_n=$(jq -r '.summary.failed' <<<"$resp")
    echo "prebuilt_installed=${installed_n} prebuilt_failed=${failed_n}"
    if [[ "$failed_n" != 0 ]]; then
      echo "prebuilt install failed for ${failed_n} rules: $(jq -c '.errors[:1]' <<<"$resp" | head -c 400)" >&2
      exit 1
    fi
    status=$(curl -sS --max-time 60 -K "$CFG" "${H[@]}" \
      -H 'elastic-api-version: 1' \
      -H 'x-elastic-internal-origin: Kibana' \
      'http://localhost:5601/internal/detection_engine/prebuilt_rules/status')
    if ! jq -e '.stats.num_prebuilt_rules_to_install | type == "number"' >/dev/null <<<"$status"; then
      echo "prebuilt status failed: $(printf '%s' "$status" | head -c 400)" >&2
      exit 1
    fi
    echo "prebuilt_status $(jq -c .stats <<<"$status")"
    left=$(jq -r '.stats.num_prebuilt_rules_to_install' <<<"$status")
    if [[ "$left" != 0 ]]; then
      echo "${left} Elastic rules are still not installed" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  register: ludus_so_elastic_security_prepackaged
  become: true
  changed_when: >-
    'installed ' in (ludus_so_elastic_security_prepackaged.stdout | default(''))
    or (
      'prebuilt_installed=' in (ludus_so_elastic_security_prepackaged.stdout | default(''))
      and 'prebuilt_installed=0' not in (ludus_so_elastic_security_prepackaged.stdout | default(''))
    )

- name: Report prebuilt rules package
  ansible.builtin.debug:
    msg: "{{ ludus_so_elastic_security_prepackaged.stdout_lines | default([]) | join(' | ') }}"

- name: Grant the curl user permission to enable detection rules
  ansible.builtin.include_tasks: grant-rule-enable.yml

- name: Enable all disabled detection rules in batches
  ansible.builtin.shell: |
    set -euo pipefail
    PAGE_SIZE={{ ludus_so_elastic_security_bulk_page_size | int }}
    if (( PAGE_SIZE < 1 || PAGE_SIZE > 1000 )); then
      echo "ludus_so_elastic_security_bulk_page_size must be 1-1000" >&2
      exit 1
    fi
    CURL=(curl -sS --max-time 180 -K /opt/so/conf/elasticsearch/curl.config \
      -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
      -H 'elastic-api-version: {{ ludus_so_elastic_security_api_version }}')
    FIND='http://localhost:5601/api/detection_engine/rules/_find'
    BULK='http://localhost:5601/api/detection_engine/rules/_bulk_action'
    ALERT_BULK='http://localhost:5601/api/alerting/rules/_bulk_enable'

    # Same shape as GOAD elk: read every disabled id, then one bulk POST per chunk.
    ids=()
    page=1
    while (( page <= 50 )); do
      resp=$("${CURL[@]}" \
        "${FIND}?per_page=${PAGE_SIZE}&page=${page}&filter=alert.attributes.enabled:false")
      if ! jq -e '.data and (.total | type == "number")' >/dev/null <<<"$resp"; then
        echo "rule find failed: $(printf '%s' "$resp" | head -c 500)" >&2
        exit 1
      fi
      count=$(jq -r '.data | length' <<<"$resp")
      if [[ "$count" -eq 0 ]]; then
        break
      fi
      while IFS= read -r id; do
        [[ -z "$id" || "$id" == null ]] && continue
        ids+=("$id")
      done < <(jq -r '.data[].id // empty' <<<"$resp")
      if (( count < PAGE_SIZE )); then
        break
      fi
      page=$((page + 1))
    done

    ndisabled=0
    for _id in "${ids[@]}"; do
      ndisabled=$((ndisabled + 1))
    done
    echo "disabled=${ndisabled}"
    if (( ndisabled == 0 )); then
      echo "done enabled=0 unenableable=0 remaining=0 chunks=0 sample_error="
      exit 0
    fi

    mode=detection
    enabled=0
    skipped=0
    chunks=0
    sample_error=""
    batch=()
    nbatch=0

    flush_batch() {
      chunks=$((chunks + 1))
      ids_json=$(printf '%s\n' "${batch[@]}" | jq -R . | jq -s -c .)
      if [[ "$mode" != alerting ]]; then
        raw=$("${CURL[@]}" -X POST "$BULK" \
          -d "{\"ids\": ${ids_json}, \"action\": \"enable\"}" -w '\n%{http_code}')
        code=$(tail -n1 <<<"$raw")
        body=$(sed '$d' <<<"$raw")
        succeeded=$(jq -r '.attributes.summary.succeeded // 0' <<<"$body" 2>/dev/null || echo 0)
        [[ "$succeeded" == null || -z "$succeeded" ]] && succeeded=0
        msg=$(jq -r '[.attributes.errors[]?.message // empty] | map(select(length > 0)) | unique | .[0] // empty' <<<"$body" 2>/dev/null || true)
        if [[ -z "$sample_error" && -n "$msg" ]]; then
          sample_error=$(printf '%s' "$msg" | tr '\n' ' ' | head -c 240)
        fi
        if [[ "$succeeded" -eq 0 && "$msg" == *"permission to enable rules"* ]]; then
          mode=alerting
          echo "chunk=${chunks} detection bulk forbidden; using alerting bulk"
        else
          rejected=$(jq -r '[.attributes.errors[]?.rules[]?.id // empty] | length' <<<"$body" 2>/dev/null || echo 0)
          [[ "$rejected" == null || -z "$rejected" ]] && rejected=0
          skipped=$((skipped + rejected))
          enabled=$((enabled + succeeded))
          echo "chunk=${chunks} http=${code} enabled_batch=${succeeded} rejected=${rejected} enabled_total=${enabled}"
          if [[ "$succeeded" -eq 0 && "$rejected" -eq 0 ]]; then
            echo "bulk enable made no progress (http ${code}): $(printf '%s' "$body" | head -c 500)" >&2
            exit 1
          fi
          return
        fi
      fi
      raw=$("${CURL[@]}" -X POST "$ALERT_BULK" \
        -d "{\"ids\": ${ids_json}}" -w '\n%{http_code}')
      code=$(tail -n1 <<<"$raw")
      body=$(sed '$d' <<<"$raw")
      if [[ "$code" != 200 && "$code" != 201 ]]; then
        echo "alerting bulk enable failed (http ${code}): $(printf '%s' "$body" | head -c 500)" >&2
        exit 1
      fi
      rejected=$(jq -r '[(.errors // [])[]] | length' <<<"$body" 2>/dev/null || echo 0)
      [[ "$rejected" == null || -z "$rejected" ]] && rejected=0
      if (( rejected > nbatch )); then
        rejected=$nbatch
      fi
      ok=$((nbatch - rejected))
      skipped=$((skipped + rejected))
      enabled=$((enabled + ok))
      echo "chunk=${chunks} http=${code} alerting_enabled=${ok} alerting_failed=${rejected} enabled_total=${enabled}"
      if [[ "$ok" -eq 0 ]]; then
        echo "alerting bulk enable rejected the chunk: $(printf '%s' "$body" | head -c 500)" >&2
        exit 1
      fi
    }

    for id in "${ids[@]}"; do
      batch+=("$id")
      nbatch=$((nbatch + 1))
      if (( nbatch >= PAGE_SIZE )); then
        flush_batch
        batch=()
        nbatch=0
      fi
    done
    if (( nbatch > 0 )); then
      flush_batch
    fi

    resp=$("${CURL[@]}" "${FIND}?per_page=1&page=1&filter=alert.attributes.enabled:false")
    remaining=$(jq -r '.total // 0' <<<"$resp")
    echo "done enabled=${enabled} unenableable=${skipped} remaining=${remaining} chunks=${chunks} sample_error=${sample_error}"
    if (( remaining > 0 && enabled == 0 )); then
      echo "no detection rules were enabled (remaining=${remaining} unenableable=${skipped} sample_error=${sample_error})" >&2
      exit 1
    fi
    if (( remaining > skipped )); then
      echo "incomplete: ${remaining} still disabled, only ${skipped} rejected by Kibana" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  register: ludus_so_elastic_security_enable
  become: true
  changed_when: "'enabled_total=' in (ludus_so_elastic_security_enable.stdout | default(''))"

- name: Report rule enable summary
  ansible.builtin.debug:
    msg: "{{ ludus_so_elastic_security_enable.stdout_lines | default([]) | last }}"

- name: Count remaining disabled rules
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sS -K /opt/so/conf/elasticsearch/curl.config \
      -H 'kbn-xsrf: true' \
      -H 'elastic-api-version: {{ ludus_so_elastic_security_api_version }}' \
      'http://localhost:5601/api/detection_engine/rules/_find?per_page=1&page=1&filter=alert.attributes.enabled:false' \
      | jq -r '.total // 0'
  args:
    executable: /bin/bash
  register: ludus_so_elastic_security_disabled_left
  changed_when: false
  become: true

- name: Report rules Kibana left disabled
  ansible.builtin.debug:
    msg: >-
      {{ ludus_so_elastic_security_disabled_left.stdout | trim }} detection rules
      are still disabled. Kibana rejected them during bulk enable (often ML rules
      with no ML node). See sample_error in the enable summary.
  when: (ludus_so_elastic_security_disabled_left.stdout | trim | int) > 0
