---
# Kibana 9.4 installs Elastic prebuilt rules as the Fleet package
# security_detection_engine (the Rules UI POST /api/fleet/package_policies).
# PUT /api/detection_engine/rules/prepackaged does not show up as that install.
# Bulk enable still uses elastic-api-version 2023-10-31. Without that header
# every enable is a 400, curl still exits 0, and the same disabled page is counted forever.
- name: Install the Elastic prebuilt rules Fleet package
  ansible.builtin.shell: |
    set -euo pipefail
    CFG=/opt/so/conf/elasticsearch/curl.config
    POL='{{ ludus_so_elastic_security_agent_policy_id }}'
    PKG='{{ ludus_so_elastic_security_detection_engine_package }}'
    VER='{{ ludus_so_elastic_security_detection_engine_version }}'
    H=(-H 'kbn-xsrf: true' -H 'Content-Type: application/json')
    api() {
      curl -sS --max-time 120 -K "$CFG" "${H[@]}" "$@"
    }

    LIST=$(api "http://localhost:5601/api/fleet/package_policies?perPage=200")
    if ! jq -e '.items' >/dev/null <<<"$LIST"; then
      echo "package policy list failed: $(printf '%s' "$LIST" | head -c 400)" >&2
      exit 1
    fi
    existing=$(jq -r --arg pkg "$PKG" '
      [.items[]? | select(.package.name == $pkg)]
      | .[0]
      | if . == null then "" else "\(.id) \(.name) \(.package.version)" end
    ' <<<"$LIST")
    if [[ -n "$existing" ]]; then
      echo "already_installed ${existing}"
    else
      if [[ -z "$VER" ]]; then
        info=$(api "http://localhost:5601/api/fleet/epm/packages/${PKG}")
        VER=$(jq -r '.item.latestVersion // .item.version // .version // empty' <<<"$info")
      fi
      if [[ -z "$VER" || "$VER" == null ]]; then
        echo "could not resolve ${PKG} version: $(printf '%s' "${info:-}" | head -c 400)" >&2
        exit 1
      fi
      name="${PKG}-1"
      body=$(jq -nc --arg ver "$VER" --arg pol "$POL" --arg name "$name" --arg pkg "$PKG" '{
        policy_ids: [$pol],
        package: {name: $pkg, version: $ver},
        name: $name,
        description: "",
        namespace: "",
        inputs: {}
      }')
      raw=$(curl -sS --max-time 600 -K "$CFG" "${H[@]}" \
        -X POST 'http://localhost:5601/api/fleet/package_policies' \
        -d "$body" -w '\n%{http_code}')
      code=$(tail -n1 <<<"$raw")
      resp=$(sed '$d' <<<"$raw")
      if [[ "$code" != 200 && "$code" != 201 ]]; then
        echo "install ${PKG} ${VER} failed (http ${code}): $(printf '%s' "$resp" | head -c 500)" >&2
        exit 1
      fi
      echo "installed $(jq -r '"\(.item.id) \(.item.name) \(.item.package.version)"' <<<"$resp")"
    fi

    limit={{ ludus_so_elastic_security_prepackaged_pause | int }}
    waited=0
    total=0
    while (( waited <= limit )); do
      found=$(curl -sS --max-time 30 -K "$CFG" "${H[@]}" \
        -H 'elastic-api-version: {{ ludus_so_elastic_security_api_version }}' \
        'http://localhost:5601/api/detection_engine/rules/_find?per_page=1&page=1')
      total=$(jq -r '.total // 0' <<<"$found")
      echo "rules_visible=${total}"
      if [[ "$total" != 0 && "$total" != null ]]; then
        break
      fi
      sleep 5
      waited=$((waited + 5))
    done
    if [[ "$total" == 0 || "$total" == null ]]; then
      echo "${PKG} did not make any detection rules visible within ${limit}s" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  register: ludus_so_elastic_security_prepackaged
  become: true
  changed_when: "'installed ' in (ludus_so_elastic_security_prepackaged.stdout | default(''))"

- name: Report prebuilt rules package
  ansible.builtin.debug:
    msg: "{{ ludus_so_elastic_security_prepackaged.stdout_lines | default([]) | join(' | ') }}"

- name: Grant the curl user permission to enable detection rules
  ansible.builtin.include_tasks: grant-rule-enable.yml

- name: Enable all disabled detection rules in batches
  ansible.builtin.shell: |
    set -euo pipefail
    PAGE_SIZE={{ ludus_so_elastic_security_bulk_page_size | int }}
    MAX_LOOPS={{ ludus_so_elastic_security_enable_max_loops | int }}
    if (( PAGE_SIZE < 1 || PAGE_SIZE > 1000 )); then
      echo "ludus_so_elastic_security_bulk_page_size must be 1-1000" >&2
      exit 1
    fi
    CURL=(curl -sS --max-time 180 -K /opt/so/conf/elasticsearch/curl.config \
      -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
      -H 'elastic-api-version: {{ ludus_so_elastic_security_api_version }}')
    FIND='http://localhost:5601/api/detection_engine/rules/_find'
    BULK='http://localhost:5601/api/detection_engine/rules/_bulk_action'
    ALERT_BULK='http://localhost:5601/api/alerting/rules/_bulk_enable'
    declare -A skip=()
    enabled=0
    skipped=0
    loops=0
    sample_error=""
    use_alerting=0

    while (( loops < MAX_LOOPS )); do
      loops=$((loops + 1))
      ids=()
      nids=0
      page=1
      while (( nids < PAGE_SIZE )); do
        resp=$("${CURL[@]}" \
          "${FIND}?per_page=${PAGE_SIZE}&page=${page}&filter=alert.attributes.enabled:false")
        if ! jq -e '.data and (.total | type == "number")' >/dev/null <<<"$resp"; then
          echo "rule find failed: $(printf '%s' "$resp" | head -c 500)" >&2
          exit 1
        fi
        count=$(jq -r '.data | length' <<<"$resp")
        if [[ "$count" -eq 0 ]]; then
          break
        fi
        while IFS= read -r id; do
          [[ -z "$id" || "$id" == "null" ]] && continue
          if [[ -n "${skip[$id]+x}" ]]; then
            continue
          fi
          ids+=("$id")
          nids=$((nids + 1))
          if (( nids >= PAGE_SIZE )); then
            break
          fi
        done < <(jq -r '.data[].id // empty' <<<"$resp")
        if (( count < PAGE_SIZE )); then
          break
        fi
        page=$((page + 1))
        if (( page > 200 )); then
          break
        fi
      done

      if (( nids == 0 )); then
        break
      fi

      if [[ "$use_alerting" -eq 0 ]]; then
        ids_json=$(printf '%s\n' "${ids[@]}" | jq -R . | jq -s -c .)
        raw=$("${CURL[@]}" -X POST "$BULK" \
          -d "{\"ids\": ${ids_json}, \"action\": \"enable\"}" -w '\n%{http_code}')
        code=$(tail -n1 <<<"$raw")
        body=$(sed '$d' <<<"$raw")
        succeeded=$(jq -r '.attributes.summary.succeeded // 0' <<<"$body" 2>/dev/null || echo 0)
        [[ "$succeeded" == "null" || -z "$succeeded" ]] && succeeded=0
        new_skips=0
        while IFS= read -r eid; do
          [[ -z "$eid" || "$eid" == "null" ]] && continue
          if [[ -z "${skip[$eid]+x}" ]]; then
            skip["$eid"]=1
            skipped=$((skipped + 1))
            new_skips=$((new_skips + 1))
          fi
        done < <(jq -r '.attributes.errors[]?.rules[]?.id // empty' <<<"$body" 2>/dev/null || true)
        if [[ -z "$sample_error" ]]; then
          sample_error=$(jq -r '[.attributes.errors[]?.message // empty] | map(select(length > 0)) | unique | .[0] // empty' <<<"$body" 2>/dev/null || true)
          sample_error=$(printf '%s' "$sample_error" | tr '\n' ' ' | head -c 240)
        fi
        echo "loop=${loops} http=${code} enabled_batch=${succeeded} skipped_new=${new_skips} enabled_total=${enabled}"
        if [[ "$succeeded" -eq 0 && "$new_skips" -eq 0 ]]; then
          echo "bulk enable made no progress (http ${code}): $(printf '%s' "$body" | head -c 500)" >&2
          exit 1
        fi
        if [[ "$succeeded" -eq 0 && "$sample_error" == *"permission to enable rules"* ]]; then
          use_alerting=1
          skipped=$((skipped - new_skips))
          for id in "${ids[@]}"; do
            unset "skip[$id]"
          done
          echo "detection bulk enable is forbidden for this user; switching to the alerting enable API"
        else
          enabled=$((enabled + succeeded))
          sleep 1
          continue
        fi
      fi

      # One bulk call. Per-rule /_enable has no Ansible output until the
      # whole shell exits, so a few thousand rules look stuck.
      ids_json=$(printf '%s\n' "${ids[@]}" | jq -R . | jq -s -c .)
      raw=$("${CURL[@]}" -X POST "$ALERT_BULK" \
        -d "{\"ids\": ${ids_json}}" -w '\n%{http_code}')
      code=$(tail -n1 <<<"$raw")
      body=$(sed '$d' <<<"$raw")
      if [[ "$code" != 200 && "$code" != 201 ]]; then
        echo "alerting bulk enable failed (http ${code}): $(printf '%s' "$body" | head -c 500)" >&2
        exit 1
      fi
      alert_fail=0
      while IFS= read -r eid; do
        [[ -z "$eid" || "$eid" == null ]] && continue
        if [[ -z "${skip[$eid]+x}" ]]; then
          skip["$eid"]=1
          skipped=$((skipped + 1))
          alert_fail=$((alert_fail + 1))
        fi
      done < <(jq -r '(.errors // [])[] | .id // .rule.id // empty' <<<"$body" 2>/dev/null || true)
      alert_ok=$((nids - alert_fail))
      if (( alert_ok < 0 )); then
        alert_ok=0
      fi
      enabled=$((enabled + alert_ok))
      echo "loop=${loops} http=${code} alerting_enabled=${alert_ok} alerting_failed=${alert_fail} enabled_total=${enabled}"
      if [[ "$alert_ok" -eq 0 ]]; then
        echo "alerting bulk enable rejected the batch: $(printf '%s' "$body" | head -c 500)" >&2
        exit 1
      fi
      sleep 1
    done

    resp=$("${CURL[@]}" "${FIND}?per_page=1&page=1&filter=alert.attributes.enabled:false")
    remaining=$(jq -r '.total // 0' <<<"$resp")
    echo "done enabled=${enabled} unenableable=${skipped} remaining=${remaining} loops=${loops} sample_error=${sample_error}"
    if (( remaining > 0 && enabled == 0 )); then
      echo "no detection rules were enabled (remaining=${remaining} unenableable=${skipped} sample_error=${sample_error})" >&2
      exit 1
    fi
    if (( remaining > skipped )); then
      echo "incomplete: ${remaining} still disabled, only ${skipped} rejected by Kibana" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  register: ludus_so_elastic_security_enable
  become: true
  changed_when: "'enabled_total=' in (ludus_so_elastic_security_enable.stdout | default(''))"

- name: Report rule enable summary
  ansible.builtin.debug:
    msg: "{{ ludus_so_elastic_security_enable.stdout_lines | default([]) | last }}"

- name: Count remaining disabled rules
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sS -K /opt/so/conf/elasticsearch/curl.config \
      -H 'kbn-xsrf: true' \
      -H 'elastic-api-version: {{ ludus_so_elastic_security_api_version }}' \
      'http://localhost:5601/api/detection_engine/rules/_find?per_page=1&page=1&filter=alert.attributes.enabled:false' \
      | jq -r '.total // 0'
  args:
    executable: /bin/bash
  register: ludus_so_elastic_security_disabled_left
  changed_when: false
  become: true

- name: Report rules Kibana left disabled
  ansible.builtin.debug:
    msg: >-
      {{ ludus_so_elastic_security_disabled_left.stdout | trim }} detection rules
      are still disabled. Kibana rejected them during bulk enable (often ML rules
      with no ML node). See sample_error in the enable summary.
  when: (ludus_so_elastic_security_disabled_left.stdout | trim | int) > 0
