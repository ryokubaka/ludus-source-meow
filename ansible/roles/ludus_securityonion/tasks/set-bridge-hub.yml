# Hub mode has to be set on the Proxmox node that owns vmbr10XX. The range
# user cannot sudo, and the API token's console stops at a login prompt. The
# token updates every Linux bridge so a network reload keeps live VM taps,
# then sets ageing_time 0 on this range's bridge.

- name: Load Proxmox API credentials for hub-mode
  ansible.builtin.set_fact:
    ludus_so_proxmox_url: >-
      {{
        ludus_so_proxmox_api_url
        | default(lookup('env', 'PROXMOX_URL'), true)
        | default('', true)
        | regex_replace('/+$', '')
      }}
    ludus_so_proxmox_user: >-
      {{
        ludus_so_proxmox_api_user
        | default(lookup('env', 'PROXMOX_USERNAME'), true)
        | default('', true)
      }}
    ludus_so_proxmox_token: >-
      {{
        ludus_so_proxmox_api_token
        | default(lookup('env', 'PROXMOX_TOKEN'), true)
        | default('', true)
      }}
    ludus_so_proxmox_secret: >-
      {{
        ludus_so_proxmox_api_secret
        | default(lookup('env', 'PROXMOX_SECRET'), true)
        | default('', true)
      }}
  no_log: true

- name: Fail when Proxmox API credentials are missing for hub-mode
  ansible.builtin.fail:
    msg: >
      Cannot set range-bridge hub mode. Proxmox API credentials are missing
      (PROXMOX_URL / PROXMOX_USERNAME / PROXMOX_TOKEN / PROXMOX_SECRET).
  when: >
    ludus_so_proxmox_url | length == 0
    or ludus_so_proxmox_user | length == 0
    or ludus_so_proxmox_token | length == 0
    or ludus_so_proxmox_secret | length == 0

- name: Build Proxmox API Authorization header for hub-mode
  ansible.builtin.set_fact:
    ludus_so_pve_auth: >-
      {{
        ('PVEAPIToken=' ~ ludus_so_proxmox_token ~ '=' ~ ludus_so_proxmox_secret)
        if ('!' in ludus_so_proxmox_token)
        else ('PVEAPIToken=' ~ ludus_so_proxmox_user ~ '!' ~ ludus_so_proxmox_token ~ '=' ~ ludus_so_proxmox_secret)
      }}
  no_log: true

- name: List Proxmox VMs when hub-mode does not yet know the bridge
  ansible.builtin.uri:
    url: "{{ ludus_so_proxmox_url }}/api2/json/cluster/resources?type=vm"
    method: GET
    headers:
      Authorization: "{{ ludus_so_pve_auth }}"
    return_content: true
    status_code: [200]
    validate_certs: false
  delegate_to: localhost
  connection: local
  vars:
    ansible_connection: local
    ansible_remote_tmp: "{{ ludus_controller_remote_tmp }}"
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  register: ludus_so_hub_resources
  no_log: true
  when: ludus_so_vmbr | default('') | length == 0

- name: Collect Proxmox VM name candidates for hub-mode
  ansible.builtin.set_fact:
    ludus_so_pve_name_candidates: >-
      {{
        [
          ludus_so_proxmox_vm_name | default('', true),
          inventory_hostname,
          ansible_hostname | default('', true),
          ansible_nodename | default('', true),
        ]
        | select('string')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Select the Security Onion VM for hub-mode
  ansible.builtin.set_fact:
    ludus_so_hub_vm: >-
      {% set found = ludus_so_hub_resources.json.data
         | selectattr('type', 'equalto', 'qemu')
         | selectattr('name', 'defined')
         | selectattr('name', 'in', ludus_so_pve_name_candidates | default([inventory_hostname]))
         | list %}
      {{ found[0] if (found | length > 0) else {} }}
  when: ludus_so_vmbr | default('') | length == 0

- name: Read the Security Onion VM NICs for hub-mode
  ansible.builtin.uri:
    url: "{{ ludus_so_proxmox_url }}/api2/json/nodes/{{ ludus_so_hub_vm.node }}/qemu/{{ ludus_so_hub_vm.vmid }}/config"
    method: GET
    headers:
      Authorization: "{{ ludus_so_pve_auth }}"
    return_content: true
    status_code: [200]
    validate_certs: false
  delegate_to: localhost
  connection: local
  vars:
    ansible_connection: local
    ansible_remote_tmp: "{{ ludus_controller_remote_tmp }}"
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  register: ludus_so_hub_config
  no_log: true
  when:
    - ludus_so_vmbr | default('') | length == 0
    - ludus_so_hub_vm.node | default('') | length > 0

- name: Use the sniff NIC bridge for hub-mode
  ansible.builtin.set_fact:
    ludus_so_pve_node: "{{ ludus_so_hub_vm.node }}"
    ludus_so_vmbr: >-
      {{
        (
          [ludus_so_hub_config.json.data.net1 | default(''), ludus_so_hub_config.json.data.net0 | default('')]
          | map('split', ',')
          | flatten
          | select('match', '^bridge=')
          | map('regex_replace', '^bridge=', '')
          | reject('equalto', '')
          | list
          | first
        )
        | default('', true)
      }}
  when:
    - ludus_so_vmbr | default('') | length == 0
    - ludus_so_hub_config is defined
    - not (ludus_so_hub_config.skipped | default(false))

- name: Resolve the range number for hub-mode
  ansible.builtin.set_fact:
    ludus_so_range_number_resolved: >-
      {{
        range_second_octet
        | default(lookup('env', 'LUDUS_RANGE_NUMBER'), true)
        | default(ludus_so_range_number_override, true)
      }}
  when: ludus_so_vmbr | default('') | length == 0

- name: Fail when the range bridge cannot be named
  ansible.builtin.fail:
    msg: >
      Cannot set hub mode without the range bridge. Need range_second_octet
      or LUDUS_RANGE_NUMBER.
  when:
    - ludus_so_vmbr | default('') | length == 0
    - ludus_so_range_number_resolved | default('') | string | length == 0

- name: Name the range bridge for hub-mode
  ansible.builtin.set_fact:
    ludus_so_vmbr: "vmbr{{ 1000 + (ludus_so_range_number_resolved | int) }}"
  when: ludus_so_vmbr | default('') | length == 0

- name: Set range bridge hub-mode on the Proxmox node
  ansible.builtin.script: set_bridge_ageing.py
  environment:
    LUDUS_SO_PVE_AUTH: "{{ ludus_so_pve_auth }}"
    LUDUS_SO_PVE_URL: "{{ ludus_so_proxmox_url }}"
    LUDUS_SO_VMBR: "{{ ludus_so_vmbr }}"
    LUDUS_SO_PVE_NODE: "{{ ludus_so_pve_node | default('') }}"
    LUDUS_SO_VM_NAMES: "{{ ludus_so_pve_name_candidates | join(',') }}"
  delegate_to: localhost
  connection: local
  vars:
    ansible_connection: local
    ansible_remote_tmp: "{{ ludus_controller_remote_tmp }}"
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  register: ludus_so_bridge_ageing
  changed_when: "'changed=yes' in (ludus_so_bridge_ageing.stdout | default(''))"
