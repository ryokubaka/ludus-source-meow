---
# SO TESTING profiles overwrite MNIC/BNICS from ls /sys/class/net. bonding_masters
# sorts before ens* → MNIC=bonding_masters → nmcli "unknown connection". Prefer
# env-provided values from the role; exclude bond/sysfs junk from auto-detect.
- name: Copy so-setup TESTING patch helper
  ansible.builtin.copy:
    src: patch_so_setup_testing.py
    dest: /tmp/patch_so_setup_testing.py
    mode: "0755"
  become: true

- name: Patch so-setup TESTING NIC / credential assignment
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /tmp/patch_so_setup_testing.py
      - "{{ ludus_so_setup_bin }}"
      - /root/SecurityOnion/setup/so-setup
      - /home/onion/SecurityOnion/setup/so-setup
  become: true
  register: ludus_so_setup_patch
  changed_when: "'patched' in (ludus_so_setup_patch.stdout | default(''))"
  # Soft-ok on pattern-not-found (SO 3.x may already honor env MNIC); hard-fail only if no so-setup file.
  failed_when: >
    ludus_so_setup_patch.rc | default(1) not in [0]
    and 'pattern-not-found' not in (ludus_so_setup_patch.stdout | default(''))

- name: Show so-setup TESTING patch result
  ansible.builtin.debug:
    msg: "{{ ludus_so_setup_patch.stdout_lines | default([]) }}"
