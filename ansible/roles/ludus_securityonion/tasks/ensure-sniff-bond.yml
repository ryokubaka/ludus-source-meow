---
# Sensors listen on bond0. Recreate/enslave sniff NIC and persist via oneshot unit.
- name: Detect sniff NIC name (first non-mgmt, non-virtual)
  ansible.builtin.shell: |
    set -euo pipefail
    MGMT="{{ ludus_so_mnic | default('') }}"
    if [[ -z "$MGMT" ]]; then
      MGMT=$(ip -4 -o addr show | awk -v ip="{{ ansible_host }}" '$4 ~ ("^" ip "/") {print $2; exit}')
    fi
    for n in $(ls -1 /sys/class/net | grep -vE '^(lo|docker|veth|br-|tun|wg|bond|bonding_masters|sobridge)'); do
      [[ "$n" == "$MGMT" ]] && continue
      echo "$n"
      exit 0
    done
    exit 1
  args:
    executable: /bin/bash
  register: ludus_so_sniff_nic_detect
  changed_when: false
  failed_when: false
  become: true

- name: Fail when sniff NIC missing for bond heal
  ansible.builtin.fail:
    msg: >
      Cannot heal sniff bond — no non-mgmt NIC found (expected ens19).
      Check Proxmox net1 / guest interfaces.
  when: ludus_so_sniff_nic_detect.rc != 0

- name: Set sniff NIC fact
  ansible.builtin.set_fact:
    ludus_so_sniff_nic: "{{ ludus_so_sniff_nic_detect.stdout | trim }}"

- name: Install ludus-so-enslave-sniff helper
  ansible.builtin.copy:
    dest: /usr/local/sbin/ludus-so-enslave-sniff
    mode: "0755"
    content: |
      #!/bin/bash
      # Ensure bond0 exists and {{ ludus_so_sniff_nic }} is enslaved (SO sensors use bond0).
      set -euo pipefail
      SNIFF="{{ ludus_so_sniff_nic }}"
      BOND=bond0
      MTU="{{ ludus_so_bond_mtu | int }}"
      [[ -d /sys/class/net/$SNIFF ]] || { echo "sniff-missing=$SNIFF"; exit 1; }

      create_bond() {
        if command -v nmcli >/dev/null 2>&1; then
          while IFS= read -r con; do
            [[ -z "$con" ]] && continue
            nmcli con down "$con" 2>/dev/null || true
            nmcli con delete "$con" 2>/dev/null || true
          done < <(nmcli -t -f NAME con show 2>/dev/null | grep -E '^(bond0|bond0-slave-)' || true)
          nmcli device disconnect "$SNIFF" 2>/dev/null || true
          nmcli con add type bond con-name bond0 ifname bond0 mode balance-rr \
            ipv4.method disabled ipv6.method ignore connection.autoconnect yes \
            802-3-ethernet.mtu "$MTU" >/dev/null
          nmcli con add type ethernet con-name "bond0-slave-${SNIFF}" ifname "$SNIFF" master bond0 \
            connection.autoconnect yes ipv4.method disabled ipv6.method ignore \
            802-3-ethernet.mtu "$MTU" >/dev/null
          nmcli con up bond0 >/dev/null || true
          nmcli con up "bond0-slave-${SNIFF}" >/dev/null || true
        fi
        if [[ ! -d /sys/class/net/$BOND ]]; then
          modprobe bonding 2>/dev/null || true
          [[ -f /sys/class/net/bonding_masters ]] && echo "+${BOND}" > /sys/class/net/bonding_masters 2>/dev/null || true
          ip link add name "$BOND" type bond mode balance-rr miimon 100 2>/dev/null \
            || ip link add name "$BOND" type bond mode 0 miimon 100 2>/dev/null \
            || true
          ip link set "$SNIFF" down 2>/dev/null || true
          ip link set "$SNIFF" nomaster 2>/dev/null || true
          ip link set "$SNIFF" master "$BOND" 2>/dev/null || true
          ip link set "$BOND" mtu "$MTU" 2>/dev/null || true
          ip link set "$SNIFF" up 2>/dev/null || true
          ip link set "$BOND" up 2>/dev/null || true
        fi
      }

      if [[ ! -d /sys/class/net/$BOND ]]; then
        create_bond
        if [[ ! -d /sys/class/net/$BOND ]]; then
          echo "bond-create-failed"
          exit 1
        fi
        echo "created-bond0"
      fi

      slaves=$(cat /sys/class/net/$BOND/bonding/slaves 2>/dev/null || true)
      if [[ " $slaves " == *" $SNIFF "* ]]; then
        ip link set "$BOND" mtu "$MTU" 2>/dev/null || true
        ip link set "$SNIFF" up 2>/dev/null || true
        ip link set "$BOND" up 2>/dev/null || true
        echo "bond-ok=$SNIFF"
        exit 0
      fi

      systemctl stop NetworkManager 2>/dev/null || true
      ip link set "$SNIFF" down 2>/dev/null || true
      ip link set "$BOND" down 2>/dev/null || true
      for s in $slaves; do
        echo "-$s" > /sys/class/net/$BOND/bonding/slaves 2>/dev/null || true
      done
      echo "+$SNIFF" > /sys/class/net/$BOND/bonding/slaves
      ip link set "$BOND" mtu "$MTU"
      ip link set "$SNIFF" up
      ip link set "$BOND" up
      systemctl start NetworkManager 2>/dev/null || true
      echo "enslaved $SNIFF -> $BOND"
  become: true

- name: Install systemd unit for sniff bond on boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/ludus-so-enslave-sniff.service
    mode: "0644"
    content: |
      [Unit]
      Description=Ensure Security Onion bond0 + sniff NIC slave
      After=network-pre.target
      Before=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/ludus-so-enslave-sniff
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  become: true
  register: ludus_so_sniff_unit

- name: Enable ludus-so-enslave-sniff.service
  ansible.builtin.systemd:
    name: ludus-so-enslave-sniff.service
    enabled: true
    daemon_reload: true
  become: true

- name: Run sniff bond create/enslave now
  ansible.builtin.command: /usr/local/sbin/ludus-so-enslave-sniff
  become: true
  register: ludus_so_enslave_now
  changed_when: >-
    'enslaved' in (ludus_so_enslave_now.stdout | default(''))
    or 'created-bond0' in (ludus_so_enslave_now.stdout | default(''))

- name: Fail when bond0 could not be created
  ansible.builtin.fail:
    msg: >
      Failed to create/enslave bond0 for sniff NIC {{ ludus_so_sniff_nic }}.
      Output: {{ ludus_so_enslave_now.stdout | default('') }}
      {{ ludus_so_enslave_now.stderr | default('') }}
  when: ludus_so_enslave_now.rc | default(1) != 0

- name: Re-assert Proxmox range bridge hub-mode (ageing 0)
  ansible.builtin.shell: |
    set -euo pipefail
    BR="{{ ludus_so_vmbr | default('') }}"
    if [[ -z "$BR" ]]; then
      RN="{{ range_second_octet | default(ludus_so_range_number_override | default('', true), true) }}"
      [[ -n "$RN" ]] || exit 0
      BR="vmbr$((1000 + RN))"
    fi
    [[ -d /sys/class/net/$BR/bridge ]] || exit 0
    echo 0 > /sys/class/net/$BR/bridge/ageing_time
    echo "bridge-ageing 0 on $BR"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: true
  changed_when: false
  failed_when: false

- name: Restart zeek/suricata when bond was created or healed
  ansible.builtin.shell: |
    set -euo pipefail
    command -v so-zeek-restart >/dev/null && so-zeek-restart || true
    command -v so-suricata-restart >/dev/null && so-suricata-restart || true
  args:
    executable: /bin/bash
  become: true
  when: ludus_so_enslave_now is changed
  async: 300
  poll: 15
