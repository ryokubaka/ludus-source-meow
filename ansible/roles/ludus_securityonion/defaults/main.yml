---
# Install type passed to so-setup test_profile: standalone (default) or eval
ludus_so_install_type: standalone

# so-setup standalone refuses to run below this (GiB).
ludus_so_mem_min_gb: 16

# so-setup profile suffix: net (DHCP/lab) or iso
ludus_so_setup_profile_suffix: net

# Attach sniff net1 via Proxmox API during Ludus deploy (no LUX required)
ludus_so_attach_sniff_nic: true

# Optional Proxmox API overrides when PROXMOX_* env is unset (GOAD provision)
ludus_so_proxmox_api_url: ""
ludus_so_proxmox_api_user: ""
ludus_so_proxmox_api_token: ""
ludus_so_proxmox_api_secret: ""
# Optional Proxmox VM name when inventory_hostname is short (GOAD: "so")
ludus_so_proxmox_vm_name: ""


# VLAN tag on the range bridge for sniff traffic (targets VLAN in SO lab blueprints)
ludus_so_sniff_tag: 10

# Optional Proxmox net1 MTU override (empty = inherit Ludus vmbr, usually 1500).
# Do NOT set 9000 unless the Proxmox range bridge is jumbo end-to-end.
ludus_so_sniff_mtu: ""

# Bond/monitor MTU passed to so-setup (virtio labs use 1500, not SO jumbo defaults)
ludus_so_bond_mtu: 1500

# Optional override when range_second_octet / LUDUS_RANGE_NUMBER unavailable
ludus_so_range_number_override: ""

# Seconds to wait for sniff NIC to appear in the guest after hot-plug
ludus_so_sniff_wait_timeout: 1800
ludus_so_sniff_wait_delay: 15

# Run PCI rescan even when Proxmox net1 already existed (guest missing sniff NIC)
ludus_so_force_pci_rescan: false

# Minimum non-loopback interfaces required before so-setup (mgmt + sniff)
ludus_so_min_nics: 2

# SOC / web user for TESTING profiles (overridden by so-setup defaults when TESTING=true)
ludus_so_web_user: "onionadmin@ludus.local"
ludus_so_web_password: "MeowMeow123"

# CIDR allowed through SO host firewall to SOC (range /16 recommended)
# Leave empty to use 0.0.0.0/0 in TESTING profile defaults
ludus_so_allow_cidr: ""

# Path to so-setup on ISO installs
ludus_so_setup_paths:
  - /root/SecurityOnion/setup/so-setup
  - /home/onion/SecurityOnion/setup/so-setup
  - /opt/so/setup/so-setup

# Marker file written after successful setup
ludus_so_setup_marker: /etc/ludus-so-setup-complete

# Detached so-setup wait (seconds / poll interval)
ludus_so_setup_timeout: 7200
ludus_so_setup_poll: 30

# Hostname used when probing Ludus router DNS forwarder (ensure-ludus-dns.yml)
ludus_so_dns_router_test_host: repo.securityonion.net

# Fail fast when SO repo hostnames do not resolve (needs working Ludus DNS + internet)
ludus_so_require_dns: true
ludus_so_dns_check_hosts:
  - repo.securityonion.net
  - repo-alt.securityonion.net

# Strip broken docker registry-mirrors (e.g. https://:5000) before so-setup pulls images
ludus_so_sanitize_docker_daemon: true

# After setup (and on redeploy), enslave sniff NIC to bond0 + persist via systemd oneshot.
# Without this, zeek/suricata listen on bond0 with NO-CARRIER and see zero traffic.
ludus_so_heal_sniff_bond: true
