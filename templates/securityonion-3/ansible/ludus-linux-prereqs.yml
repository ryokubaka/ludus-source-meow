# Ludus Linux template requirements:
# https://docs.ludus.cloud/docs/using-ludus/templates#non-automated-os-template-builds
- name: Ludus Linux template prerequisites
  hosts: all
  become: true
  tasks:
    - name: Ensure curl and dnf plugins for guest-agent install
      ansible.builtin.dnf:
        name:
          - curl
          - ca-certificates
          - dnf-plugins-core
        state: present

    - name: Ensure python3 and sudo are installed
      ansible.builtin.dnf:
        name:
          - python3
          - sudo
        state: present

    - name: Ensure python3-libselinux when available
      ansible.builtin.dnf:
        name: python3-libselinux
        state: present
      failed_when: false

    - name: Ensure template user has passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/{{ ansible_user }}
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Install qemu-guest-agent (required for Ludus)
      ansible.builtin.script: "{{ playbook_dir }}/../scripts/install-qemu-guest-agent.sh"
      args:
        executable: /bin/bash
      register: qemu_ga_install
      changed_when: "'installed:' in qemu_ga_install.stderr or 'already installed' not in qemu_ga_install.stderr"

    - name: Verify qemu-guest-agent package is installed
      ansible.builtin.command: rpm -q qemu-guest-agent
      changed_when: false

    - name: Wait for Proxmox guest-agent virtio port
      ansible.builtin.wait_for:
        path: /dev/virtio-ports/org.qemu.guest_agent.0
        timeout: 60
      failed_when: false

    - name: Enable and start qemu-guest-agent
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: Ensure sshd is enabled
      ansible.builtin.service:
        name: sshd
        enabled: true
        state: started

    - name: Allow password SSH for Ludus
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication yes' }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin yes' }
      notify: Restart sshd

    - name: Ensure NetworkManager provides DHCP on boot
      ansible.builtin.service:
        name: NetworkManager
        enabled: true
        state: started

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
