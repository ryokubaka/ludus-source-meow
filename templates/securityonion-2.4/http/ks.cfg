# Ludus Packer unattended OS install for Security Onion 2.4 ISO.
# Overrides ISO ks=cdrom (interactive yes / so-setup-on-login).
# so-setup itself runs later via ludus_securityonion at range deploy.

cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --activate --onboot=yes
rootpw --plaintext onion
user --name=onion --password=onion --plaintext --groups=wheel
firewall --enabled --ssh
selinux --permissive
firstboot --disable
skipx
text
# Auto-reboot — stock ISO asks "Press Enter to reboot" (Packer never sends it).
reboot --eject

zerombr
clearpart --all --initlabel
bootloader --location=mbr
part biosboot --fstype=biosboot --size=1
part /boot --fstype=xfs --size=1024
part pv.01 --size=1 --grow
volgroup so pv.01
logvol swap --fstype=swap --name=swap --vgname=so --size=8192
logvol /tmp --fstype=xfs --name=tmp --vgname=so --size=2048 --fsoptions="nodev,nosuid,noexec"
logvol / --fstype=xfs --name=root --vgname=so --size=51200
logvol /nsm --fstype=xfs --name=nsm --vgname=so --size=1 --grow

%packages
@^minimal-environment
openssh-server
qemu-guest-agent
python3
sudo
curl
wget
%end

%post --nochroot --log=/mnt/sysimage/root/ks-post-nochroot.log
set -x
mkdir -p /mnt/sysimage/root/SecurityOnion
mkdir -p /mnt/sysimage/nsm/docker-registry/docker
mkdir -p /mnt/sysimage/nsm/repo

REPO=""
for candidate in /run/install/repo /mnt/install/repo /mnt/source; do
  if [ -d "$candidate" ]; then
    REPO="$candidate"
    break
  fi
done

if [ -n "$REPO" ]; then
  if [ -d "$REPO/SecurityOnion" ]; then
    cp -a "$REPO/SecurityOnion/." /mnt/sysimage/root/SecurityOnion/ || true
  elif [ -d "$REPO/securityonion" ]; then
    cp -a "$REPO/securityonion/." /mnt/sysimage/root/SecurityOnion/ || true
  fi
  if [ -d "$REPO/docker" ]; then
    cp -a "$REPO/docker/." /mnt/sysimage/nsm/docker-registry/docker/ || true
  elif [ -d "$REPO/dockerimages" ]; then
    mkdir -p /mnt/sysimage/nsm/docker-images
    cp -a "$REPO/dockerimages/." /mnt/sysimage/nsm/docker-images/ || true
  fi
  if [ -d "$REPO/Packages" ]; then
    cp -a "$REPO/Packages/." /mnt/sysimage/nsm/repo/ || true
  fi
fi
%end

%post --log=/root/ks-post.log
set -x
systemctl enable sshd
systemctl enable qemu-guest-agent
systemctl start qemu-guest-agent || true
echo "onion ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/onion
chmod 440 /etc/sudoers.d/onion
sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config || true

# No interactive so-setup on template login (deploy role runs so-setup later).
for f in /home/onion/.bash_profile /home/onion/.bashrc /root/.bash_profile /root/.bashrc; do
  if [ -f "$f" ]; then
    sed -i '/so-setup/d;/SecurityOnion\/setup/d' "$f" || true
  fi
done
# Also neutralize common SO first-login hooks if present.
rm -f /etc/profile.d/*so-setup* /etc/profile.d/*securityonion* 2>/dev/null || true

touch /etc/ludus-so-template
echo "securityonion-2.4-packer" >/etc/ludus-so-template

# #region agent log
printf '%s\n' '{"sessionId":"d940ab","hypothesisId":"H2","location":"ks.cfg:%post","message":"custom_ks_post_completed","data":{"guest_agent_enabled":true,"sosetup_stripped":true},"timestamp":0,"runId":"post-fix"}' >/etc/ludus-so-debug.ndjson
# #endregion
%end
